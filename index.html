<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>

<!-- ============================================================
     MODELO DE QUIZ FUNNEL  —  100% editável
     Tudo que você precisa mudar está no bloco CONFIG abaixo (no <script>).
     Estrutura: Intro -> Perguntas -> Análise -> Resultado/Oferta
     ============================================================ -->

<style>
  :root{
    --bg:        #0e1230;       /* fundo geral */
    --card:      #ffffff;       /* cartão central */
    --ink:       #1a1c2e;       /* texto principal */
    --muted:     #6b6f86;       /* texto secundário */
    --accent:    #4f46e5;       /* cor da marca (botões, progresso) */
    --accent-2:  #7c6cf5;       /* degradê */
    --line:      #e7e8f0;       /* bordas */
    --ok:        #16a34a;       /* destaque positivo */
    --radius:    16px;
    --shadow:    0 18px 50px -12px rgba(20,18,60,.35);
    --maxw:      560px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,108,245,.35), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(79,70,229,.30), transparent 55%),
      var(--bg);
    color:var(--ink);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-font-smoothing:antialiased;
  }

  .stage{width:100%;max-width:var(--maxw)}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:32px 26px 30px;
    position:relative;
    overflow:hidden;
  }

  /* barra de progresso */
  .progress-wrap{display:none;margin-bottom:24px}
  .progress-wrap.show{display:block}
  .progress-meta{
    display:flex;justify-content:space-between;
    font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;
  }
  .progress-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:99px;transition:width .4s ease;
  }

  /* telas */
  .screen{display:none;animation:fade .35s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .eyebrow{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);
    background:rgba(79,70,229,.08);padding:6px 12px;border-radius:99px;margin-bottom:16px;
  }

  h1{font-size:26px;line-height:1.25;margin-bottom:12px;letter-spacing:-.01em}
  .question h1{font-size:23px}
  .sub{color:var(--muted);font-size:16px;line-height:1.55;margin-bottom:26px}

  /* opções */
  .options{display:flex;flex-direction:column;gap:12px}
  .option{
    display:flex;align-items:center;gap:14px;
    width:100%;text-align:left;cursor:pointer;
    background:#fff;border:2px solid var(--line);border-radius:12px;
    padding:16px 18px;font-size:16px;font-weight:600;color:var(--ink);
    transition:border-color .15s,transform .08s,background .15s;
  }
  .option:hover{border-color:var(--accent);background:rgba(79,70,229,.03)}
  .option:active{transform:scale(.99)}
  .option .ic{font-size:22px;line-height:1}
  .option.selected{border-color:var(--accent);background:rgba(79,70,229,.06)}

  /* botão principal */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;border:none;cursor:pointer;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#fff;font-size:17px;font-weight:700;
    padding:16px 22px;border-radius:12px;margin-top:8px;
    transition:transform .08s,box-shadow .2s;
    box-shadow:0 10px 24px -8px rgba(79,70,229,.7);
  }
  .btn:hover{box-shadow:0 14px 30px -8px rgba(79,70,229,.85)}
  .btn:active{transform:translateY(1px)}
  .btn.green{
    background:linear-gradient(90deg,#16a34a,#22c55e);
    box-shadow:0 10px 24px -8px rgba(22,163,74,.7);
  }

  .small{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}

  /* tela de análise (loader) */
  .loader{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0}
  .spinner{
    width:54px;height:54px;border-radius:50%;
    border:5px solid var(--line);border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;margin-bottom:22px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-step{font-size:15px;color:var(--muted);min-height:22px;font-weight:600}

  /* resultado */
  .result-badge{
    width:64px;height:64px;border-radius:50%;
    background:rgba(22,163,74,.12);color:var(--ok);
    display:flex;align-items:center;justify-content:center;
    font-size:32px;margin:0 auto 18px;
  }
  .result .sub{margin-bottom:22px}
  .bullets{list-style:none;margin:0 0 26px;display:flex;flex-direction:column;gap:12px}
  .bullets li{
    display:flex;gap:12px;align-items:flex-start;
    font-size:15px;color:var(--ink);line-height:1.45;
  }
  .bullets li::before{content:"✓";color:var(--ok);font-weight:800;flex:none}

  /* gate de idade — opcional, apague a tela se não precisar */
  .gate .options{flex-direction:row}
  .gate .option{justify-content:center}

  .footer-note{text-align:center;color:rgba(255,255,255,.5);font-size:12px;margin-top:18px}

  @media (max-width:420px){
    .card{padding:26px 18px 24px}
    h1{font-size:23px}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">

    <!-- barra de progresso (aparece só nas perguntas) -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-meta">
        <span id="progressLabel">Pergunta 1</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <!-- AS TELAS SÃO GERADAS AUTOMATICAMENTE PELO SCRIPT -->
    <div id="screens"></div>

  </div>
  <p class="footer-note" id="footerNote"></p>
</div>

<script>
/* ============================================================
   CONFIG  —  EDITE TUDO AQUI
   ============================================================ */
const CONFIG = {

  // texto pequeno no rodapé (deixe "" pra esconder)
  rodape: "© 2025 Sua Marca",

  // ---- gate de idade (opcional) ----
  // ative só se o seu produto precisar. Pra desligar: usarGate: false
  usarGate: false,
  gate: {
    pergunta: "Você tem mais de 18 anos?",
    sim: "Sim",
    nao: "Não",
    textoSaida: "Este conteúdo é destinado a maiores de 18 anos."
  },

  // ---- tela de abertura ----
  intro: {
    selo: "Quiz rápido • 1 minuto",
    titulo: "Descubra o plano ideal pra você",
    subtitulo: "Responda 4 perguntas rápidas e receba uma recomendação personalizada no final.",
    botao: "Começar agora"
  },

  // ---- perguntas ----
  // adicione ou remova quantas quiser. "ic" (emoji) é opcional.
  perguntas: [
    {
      titulo: "Qual é o seu principal objetivo?",
      opcoes: [
        { ic: "🎯", texto: "Resultado rápido" },
        { ic: "📈", texto: "Crescimento constante" },
        { ic: "🧩", texto: "Aprender do zero" }
      ]
    },
    {
      titulo: "Quanto tempo você tem por dia?",
      opcoes: [
        { ic: "⏱️", texto: "Menos de 30 min" },
        { ic: "🕐", texto: "1 a 2 horas" },
        { ic: "🔥", texto: "Tempo livre total" }
      ]
    },
    {
      titulo: "Qual é o seu nível hoje?",
      opcoes: [
        { ic: "🌱", texto: "Iniciante" },
        { ic: "⚙️", texto: "Intermediário" },
        { ic: "🚀", texto: "Avançado" }
      ]
    },
    {
      titulo: "O que mais te trava no momento?",
      opcoes: [
        { ic: "❓", texto: "Não sei por onde começar" },
        { ic: "🧭", texto: "Falta de método" },
        { ic: "⏳", texto: "Falta de constância" }
      ]
    }
  ],

  // ---- tela de análise (loader) ----
  analise: {
    duracaoMs: 2600, // tempo total da "análise"
    passos: [
      "Analisando suas respostas...",
      "Cruzando seu perfil...",
      "Montando sua recomendação..."
    ]
  },

  // ---- resultado / oferta ----
  resultado: {
    selo: "Resultado pronto ✅",
    titulo: "Encontramos o caminho certo pra você",
    subtitulo: "Com base nas suas respostas, este é o plano que mais combina com o seu perfil e o seu tempo disponível.",
    beneficios: [
      "Passo a passo adaptado ao seu nível",
      "Funciona mesmo com pouco tempo por dia",
      "Acesso imediato após a confirmação"
    ],
    precoDe: "R$ 197",
    precoPor: "R$ 47",
    botao: "Quero meu acesso agora",
    // >>> TROQUE pelo seu link de checkout (Hotmart, Kiwify, etc.) <<<
    linkCheckout: "https://pay.seu-checkout.com/SEU-PRODUTO",
    garantia: "Pagamento 100% seguro • Garantia de 7 dias"
  }
};

/* ============================================================
   MOTOR DO QUIZ  —  normalmente você não precisa mexer aqui
   ============================================================ */
const respostas = [];
let idxPergunta = 0;

const elScreens   = document.getElementById("screens");
const elProgWrap  = document.getElementById("progressWrap");
const elProgBar   = document.getElementById("progressBar");
const elProgLabel = document.getElementById("progressLabel");
const elProgPct   = document.getElementById("progressPct");
document.getElementById("footerNote").textContent = CONFIG.rodape || "";
document.title = CONFIG.intro.titulo;

function show(html, extraClass=""){
  elScreens.innerHTML = `<div class="screen active ${extraClass}">${html}</div>`;
}
function showProgress(on){ elProgWrap.classList.toggle("show", on); }

function updateProgress(){
  const total = CONFIG.perguntas.length;
  const pct = Math.round((idxPergunta / total) * 100);
  elProgBar.style.width = pct + "%";
  elProgLabel.textContent = `Pergunta ${Math.min(idxPergunta+1,total)} de ${total}`;
  elProgPct.textContent = pct + "%";
}

/* --- gate de idade --- */
function renderGate(){
  showProgress(false);
  const g = CONFIG.gate;
  show(`
    <span class="eyebrow">Verificação</span>
    <h1>${g.pergunta}</h1>
    <div class="options">
      <button class="option" id="gateSim"><span>${g.sim}</span></button>
      <button class="option" id="gateNao"><span>${g.nao}</span></button>
    </div>
  `, "gate");
  document.getElementById("gateSim").onclick = renderIntro;
  document.getElementById("gateNao").onclick = () => {
    show(`<h1>Acesso restrito</h1><p class="sub">${g.textoSaida}</p>`);
  };
}

/* --- intro --- */
function renderIntro(){
  showProgress(false);
  const i = CONFIG.intro;
  show(`
    <span class="eyebrow">${i.selo}</span>
    <h1>${i.titulo}</h1>
    <p class="sub">${i.subtitulo}</p>
    <button class="btn" id="start">${i.botao} →</button>
  `);
  document.getElementById("start").onclick = () => { idxPergunta = 0; renderPergunta(); };
}

/* --- perguntas --- */
function renderPergunta(){
  showProgress(true);
  updateProgress();
  const q = CONFIG.perguntas[idxPergunta];
  const opts = q.opcoes.map((o,n)=>`
    <button class="option" data-i="${n}">
      ${o.ic ? `<span class="ic">${o.ic}</span>` : ""}
      <span>${o.texto}</span>
    </button>`).join("");
  show(`<h1>${q.titulo}</h1><div class="options">${opts}</div>`, "question");

  elScreens.querySelectorAll(".option").forEach(btn=>{
    btn.onclick = ()=>{
      respostas[idxPergunta] = q.opcoes[btn.dataset.i].texto;
      btn.classList.add("selected");
      setTimeout(()=>{
        idxPergunta++;
        if(idxPergunta < CONFIG.perguntas.length){ renderPergunta(); }
        else { renderAnalise(); }
      }, 220);
    };
  });
}

/* --- análise (loader) --- */
function renderAnalise(){
  showProgress(true);
  elProgBar.style.width = "100%";
  elProgLabel.textContent = "Finalizando";
  elProgPct.textContent = "100%";
  const a = CONFIG.analise;
  show(`
    <div class="loader">
      <div class="spinner"></div>
      <p class="loader-step" id="step">${a.passos[0]}</p>
    </div>
  `);
  const stepEl = document.getElementById("step");
  let s = 0;
  const each = a.duracaoMs / a.passos.length;
  const timer = setInterval(()=>{
    s++;
    if(s < a.passos.length){ stepEl.textContent = a.passos[s]; }
    else { clearInterval(timer); }
  }, each);
  setTimeout(renderResultado, a.duracaoMs);
}

/* --- resultado / oferta --- */
function renderResultado(){
  showProgress(false);
  const r = CONFIG.resultado;
  const bullets = r.beneficios.map(b=>`<li>${b}</li>`).join("");
  const preco = (r.precoDe || r.precoPor) ? `
    <p class="sub" style="margin-bottom:18px">
      ${r.precoDe ? `<s style="color:var(--muted)">${r.precoDe}</s>&nbsp;` : ""}
      ${r.precoPor ? `<strong style="color:var(--ink);font-size:22px">${r.precoPor}</strong>` : ""}
    </p>` : "";
  show(`
    <div class="result-badge">✓</div>
    <span class="eyebrow">${r.selo}</span>
    <h1>${r.titulo}</h1>
    <p class="sub">${r.subtitulo}</p>
    <ul class="bullets">${bullets}</ul>
    ${preco}
    <a class="btn green" href="${r.linkCheckout}" id="cta">${r.botao}</a>
    <p class="small">${r.garantia || ""}</p>
  `, "result");
}

/* --- inicia o funil --- */
CONFIG.usarGate ? renderGate() : renderIntro();
</script>
</body>
</html>
